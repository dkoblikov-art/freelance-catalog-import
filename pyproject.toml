[project]
name = "freelance-catalog-import"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["integration: requires explicit permission and a dedicated cat001_test database"]
